<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Диалог с врачом — оценка рисков</title>
<style>
:root {
--bg: linear-gradient(135deg, #e0eafc, #cfdef3);
--card: #fff;
--text: #2d3748;
--text-soft: #4a5568;
--muted: #718096;
--border: #cbd5e0;
--header: #2c5282;
--header-text: #fff;
--bubble: #f7fafc;
--btn: #2c5282;
--btn-hover: #2a4365;
--btn-sec: #edf2f7;
--btn-sec-text: #2d3748;
--risk-low: #c6f6d5;
--risk-low-t: #22543d;
--risk-med: #feebc8;
--risk-med-t: #7b341e;
--risk-high: #fed7d7;
--risk-high-t: #742a2a;
--missing: #fff5b1;
--missing-b: #f6e05e;
--credentials-bg: #f7fafc;
--input-bg: #fff;
--accent: #38a169;
--taplink: #6b46c1;
--taplink-hover: #553c9a;
--hint-bg: #ebf8ff;
--hint-border: #90cdf4;
--hint-text: #2c5282;
--pregnant-bg: #fef5e7;
--pregnant-border: #f39c12;
--pregnant-text: #7d6608;
--therapy-bg: #fff5f5;
--therapy-border: #fc8181;
--therapy-text: #742a2a;
--stop-bg: #fff8f0;
--stop-border: #ed8936;
--stop-text: #7b341e;
--section-bg: #edf2f7;
--section-title: #2c5282;
--group-lifestyle: #ebf8ff;
--group-lifestyle-b: #4299e1;
--group-lifestyle-t: #2c5282;
--group-med: #fff5f5;
--group-med-b: #fc8181;
--group-med-t: #742a2a;
--group-exam: #f0fff4;
--group-exam-b: #48bb78;
--group-exam-t: #22543d;
}
body.dark {
--bg: linear-gradient(135deg, #1a202c, #2d3748);
--card: #2d3748;
--text: #e2e8f0;
--text-soft: #cbd5e0;
--muted: #a0aec0;
--border: #4a5568;
--header: #1a365d;
--header-text: #fff;
--bubble: #1a202c;
--btn: #4299e1;
--btn-hover: #3182ce;
--btn-sec: #4a5568;
--btn-sec-text: #e2e8f0;
--risk-low: #22543d;
--risk-low-t: #c6f6d5;
--risk-med: #7b341e;
--risk-med-t: #feebc8;
--risk-high: #742a2a;
--risk-high-t: #fed7d7;
--missing: #744210;
--missing-b: #d69e2e;
--credentials-bg: #1a202c;
--input-bg: #1a202c;
--accent: #48bb78;
--taplink: #9f7aea;
--taplink-hover: #805ad5;
--hint-bg: #1a365d;
--hint-border: #2b6cb0;
--hint-text: #90cdf4;
--pregnant-bg: #744210;
--pregnant-border: #d69e2e;
--pregnant-text: #fbd38d;
--therapy-bg: #742a2a;
--therapy-border: #fc8181;
--therapy-text: #fed7d7;
--stop-bg: #744210;
--stop-border: #ed8936;
--stop-text: #fbd38d;
--section-bg: #1a202c;
--section-title: #90cdf4;
--group-lifestyle: #1a365d;
--group-lifestyle-b: #4299e1;
--group-lifestyle-t: #90cdf4;
--group-med: #742a2a;
--group-med-b: #fc8181;
--group-med-t: #fed7d7;
--group-exam: #22543d;
--group-exam-b: #48bb78;
--group-exam-t: #c6f6d5;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
background: var(--bg);
min-height: 100vh;
display: flex;
justify-content: center;
padding: 20px;
color: var(--text);
transition: background 0.3s, color 0.3s;
font-size: 16px;
}
.app {
width: 100%;
max-width: 780px;
background: var(--card);
border-radius: 16px;
box-shadow: 0 10px 40px rgba(0,0,0,0.15);
overflow: hidden;
transition: background 0.3s;
}
.header {
background: var(--header);
color: var(--header-text);
padding: 16px 24px;
font-size: 18px;
font-weight: 600;
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
}
.header-title { flex: 1; min-width: 0; }
.header-controls { display: flex; gap: 8px; flex-shrink: 0; }
.reset-btn, .theme-btn {
background: rgba(255,255,255,0.2);
border: 1px solid rgba(255,255,255,0.3);
color: #fff;
padding: 6px 12px;
border-radius: 6px;
cursor: pointer;
font-size: 13px;
white-space: nowrap;
}
.reset-btn:hover, .theme-btn:hover { background: rgba(255,255,255,0.3); }
.content { padding: 24px; min-height: 400px; }
.fade-in { animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}
.stagger > * { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
.stagger > *:nth-child(1) { animation-delay: 0.05s; }
.stagger > *:nth-child(2) { animation-delay: 0.15s; }
.stagger > *:nth-child(3) { animation-delay: 0.25s; }
.stagger > *:nth-child(4) { animation-delay: 0.35s; }
.stagger > *:nth-child(5) { animation-delay: 0.45s; }
.stagger > *:nth-child(6) { animation-delay: 0.55s; }
.stagger > *:nth-child(7) { animation-delay: 0.65s; }
.stagger > *:nth-child(8) { animation-delay: 0.75s; }
.progress {
position: relative;
height: 22px;
background: var(--border);
border-radius: 11px;
margin-bottom: 24px;
overflow: hidden;
cursor: pointer;
}
.progress-segments {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
display: flex;
z-index: 1;
}
.progress-seg {
flex: 1;
background: transparent;
border-right: 1px solid rgba(255,255,255,0.3);
transition: background 0.2s;
position: relative;
}
.progress-seg:last-child { border-right: none; }
.progress-seg:hover { background: rgba(255,255,255,0.15); }
.progress-seg.done { background: rgba(56, 161, 105, 0.35); }
.progress-seg.current { background: rgba(66, 153, 225, 0.35); }
.progress-bar {
position: absolute;
top: 0; left: 0;
height: 100%;
background: linear-gradient(90deg, #38a169, #48bb78);
transition: width 0.4s;
z-index: 2;
pointer-events: none;
opacity: 0.55;
}
.fill-indicator {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
font-size: 11px;
font-weight: 600;
color: var(--text);
white-space: nowrap;
z-index: 3;
pointer-events: none;
text-shadow: 0 0 3px var(--card);
}
.step-check {
position: absolute;
right: -4px;
top: -6px;
width: 22px;
height: 22px;
background: var(--accent);
color: #fff;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 13px;
font-weight: bold;
opacity: 0;
transform: scale(0);
pointer-events: none;
z-index: 4;
box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.step-check.show { animation: checkPop 1.5s ease-out forwards; }
@keyframes checkPop {
0% { opacity: 0; transform: scale(0) rotate(-45deg); }
20% { opacity: 1; transform: scale(1.3) rotate(0deg); }
40% { transform: scale(1) rotate(0deg); }
75% { opacity: 1; transform: scale(1) rotate(0deg); }
100% { opacity: 0; transform: scale(0.9) rotate(0deg); }
}
.field { margin-bottom: 16px; }
.field label {
display: block;
margin-bottom: 6px;
font-weight: 500;
color: var(--text);
font-size: 15px;
}
.field input, .field select {
width: 100%;
padding: 12px 14px;
border: 1px solid var(--border);
border-radius: 8px;
font-size: 16px;
background: var(--input-bg);
color: var(--text);
transition: border-color 0.2s, background 0.2s;
}
.field input::placeholder { color: var(--muted); }
.field .hint {
font-size: 13px;
color: var(--muted);
margin-top: 4px;
font-style: italic;
}
.field.error input, .field.error select {
border-color: #e53e3e;
border-width: 2px;
background: #fff5f5;
}
body.dark .field.error input, body.dark .field.error select { background: #3d2424; }
.field-error-text {
font-size: 12px;
color: #e53e3e;
margin-top: 4px;
font-weight: 500;
display: none;
}
.field.error .field-error-text { display: block; }
.error-message {
background: var(--risk-high);
border-left: 4px solid #e53e3e;
padding: 14px;
border-radius: 0 8px 8px 0;
margin: 16px 0 0 0;
font-size: 15px;
color: var(--risk-high-t);
line-height: 1.5;
font-weight: 500;
}
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row .field { flex: 1; min-width: 140px; }
.btn {
background: var(--btn);
color: #fff;
border: none;
padding: 14px 24px;
border-radius: 8px;
font-size: 16px;
cursor: pointer;
font-weight: 500;
transition: background 0.2s, transform 0.1s;
text-decoration: none;
display: inline-block;
}
.btn:hover { background: var(--btn-hover); }
.btn:active { transform: scale(0.98); }
.btn.secondary { background: var(--btn-sec); color: var(--btn-sec-text); }
.btn.secondary:hover { background: var(--border); }
.btn.small { padding: 10px 16px; font-size: 14px; }
.btn.accent { background: var(--accent); }
.btn.accent:hover { background: #2f855a; }
.btn.taplink { background: var(--taplink); font-weight: 600; }
.btn.taplink:hover { background: var(--taplink-hover); }
.btn.warning { background: #dd6b20; }
.btn.warning:hover { background: #c05621; }
.btn.doctor { background: #e53e3e; font-weight: 600; }
.btn.doctor:hover { background: #c53030; }
.actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.intro { text-align: center; padding: 20px 0; }
.intro-avatar { width: 150px; height: 200px; margin: 0 auto 20px; }
.intro-avatar svg { width: 100%; height: 100%; }
.intro h2 { color: var(--btn); margin-bottom: 10px; font-size: 26px; }
.intro p { color: var(--text-soft); line-height: 1.6; margin-bottom: 15px; font-size: 16px; }
.intro .credentials {
background: var(--credentials-bg);
border-left: 4px solid var(--btn);
padding: 15px;
margin: 20px 0;
text-align: left;
border-radius: 0 8px 8px 0;
}
.intro .credentials h3 { margin-top: 0; color: var(--btn); font-size: 17px; }
.intro .credentials ul { margin: 10px 0; padding-left: 20px; }
.intro .credentials li { margin: 8px 0; color: var(--text-soft); font-size: 15px; }
.dialog { display: flex; gap: 16px; flex-wrap: wrap; }
.avatar { flex-shrink: 0; width: 120px; height: 160px; }
.avatar svg { width: 100%; height: 100%; }
.mouth {
transform-origin: center;
animation: talk 0.3s infinite alternate;
animation-play-state: paused;
}
.mouth.active { animation-play-state: running; }
@keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(0.4); } }
.bubble {
flex: 1;
background: var(--bubble);
border-radius: 12px;
padding: 18px;
font-size: 16px;
line-height: 1.6;
color: var(--text);
min-width: 280px;
transition: background 0.3s;
}
.options { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.option {
background: var(--card);
border: 1px solid var(--border);
padding: 12px 16px;
border-radius: 8px;
cursor: pointer;
text-align: left;
font-size: 15px;
transition: all 0.2s;
color: var(--text);
}
.option:hover { border-color: var(--btn); background: var(--bubble); transform: translateX(4px); }
.option.taplink-opt {
border-color: var(--taplink);
background: var(--taplink);
color: #fff;
font-weight: 600;
}
.option.taplink-opt:hover { background: var(--taplink-hover); }
.option.doctor-opt {
border-color: #e53e3e;
background: #e53e3e;
color: #fff;
font-weight: 600;
}
.option.doctor-opt:hover { background: #c53030; }
.risk { display: inline-block; padding: 4px 12px; border-radius: 4px; font-weight: 600; font-size: 14px; }
.risk.low { background: var(--risk-low); color: var(--risk-low-t); }
.risk.med { background: var(--risk-med); color: var(--risk-med-t); }
.risk.high { background: var(--risk-high); color: var(--risk-high-t); }
.risk.anemia { background: var(--risk-high); color: var(--risk-high-t); }
.risk.warn { background: #bee3f8; color: #2a4365; }
.risk.pregnant { background: var(--pregnant-bg); color: var(--pregnant-text); border: 1px solid var(--pregnant-border); }
.missing-data {
background: var(--missing);
border: 1px solid var(--missing-b);
padding: 10px;
border-radius: 8px;
margin-top: 12px;
font-size: 14px;
color: var(--text);
}
.info-hint {
background: var(--hint-bg);
border-left: 3px solid var(--hint-border);
padding: 12px;
border-radius: 0 8px 8px 0;
margin: 12px 0;
font-size: 14px;
color: var(--hint-text);
line-height: 1.5;
}
.good-news {
background: var(--risk-low);
border-left: 4px solid var(--risk-low-t);
padding: 14px;
border-radius: 0 8px 8px 0;
margin: 12px 0;
font-size: 15px;
color: var(--risk-low-t);
line-height: 1.5;
}
.pregnant-warning {
background: var(--pregnant-bg);
border-left: 4px solid var(--pregnant-border);
padding: 14px;
border-radius: 0 8px 8px 0;
margin: 12px 0;
font-size: 15px;
color: var(--pregnant-text);
line-height: 1.5;
}
.therapy-hint {
background: var(--therapy-bg);
border-left: 4px solid var(--therapy-border);
padding: 14px;
border-radius: 0 8px 8px 0;
margin: 12px 0;
font-size: 15px;
color: var(--therapy-text);
line-height: 1.5;
font-weight: 500;
}
.diabetes-info {
background: var(--therapy-bg);
border-left: 4px solid var(--therapy-border);
padding: 14px;
border-radius: 0 8px 8px 0;
margin: 12px 0;
font-size: 15px;
color: var(--therapy-text);
line-height: 1.6;
}
.risk-scale {
margin: 10px 0 14px 0;
padding: 10px 12px;
background: var(--bubble);
border-radius: 8px;
}
.risk-scale-bar {
position: relative;
height: 20px;
border-radius: 10px;
overflow: hidden;
display: flex;
margin-bottom: 6px;
}
.risk-scale-bar .seg { flex: 1; }
.risk-scale.risk-type .seg.s1 { background: #48bb78; }
.risk-scale.risk-type .seg.s2 { background: #ed8936; }
.risk-scale.risk-type .seg.s3 { background: #f56565; }
.risk-scale.risk-type .seg.s4 { background: #c53030; }
.risk-scale.bi-type .seg.s1 { background: #c53030; }
.risk-scale.bi-type .seg.s2 { background: #ed8936; }
.risk-scale.bi-type .seg.s3 { background: #48bb78; }
.risk-scale.bi-type .seg.s4 { background: #ed8936; }
.risk-scale.bi-type .seg.s5 { background: #c53030; }
.risk-scale.egfr-type .seg.s1 { background: #c53030; }
.risk-scale.egfr-type .seg.s2 { background: #ed8936; }
.risk-scale.egfr-type .seg.s3 { background: #68d391; }
.risk-scale.egfr-type .seg.s4 { background: #38a169; }
.risk-scale.egfr-type .seg.s5 { background: #f56565; }
.risk-scale-marker {
position: absolute;
top: -4px;
width: 4px;
height: 28px;
background: #1a202c;
border-radius: 2px;
transition: left 0.5s;
box-shadow: 0 0 0 2px #fff;
}
.risk-scale-labels {
display: flex;
justify-content: space-between;
font-size: 11px;
color: var(--muted);
}
.report-section {
background: var(--bubble);
border-radius: 12px;
padding: 18px;
margin-bottom: 16px;
}
.report-section h3 {
margin-top: 0;
color: var(--btn);
font-size: 18px;
border-bottom: 2px solid var(--border);
padding-bottom: 8px;
}
.report-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 0;
border-bottom: 1px dashed var(--border);
flex-wrap: wrap;
gap: 8px;
font-size: 15px;
}
.report-item:last-child { border-bottom: none; }
.report-item .val-block { text-align: right; }
.report-item .ref-line {
display: block;
font-size: 12px;
color: var(--muted);
margin-top: 2px;
font-weight: 400;
}
.bio-age-display {
text-align: center;
padding: 24px;
background: linear-gradient(135deg, var(--btn), #2b6cb0);
color: #fff;
border-radius: 12px;
margin-bottom: 16px;
}
.bio-age-number { font-size: 56px; font-weight: 700; line-height: 1; }
.bio-age-label { font-size: 15px; opacity: 0.9; margin-top: 4px; }
.bio-age-diff {
display: inline-block;
margin-top: 10px;
padding: 5px 14px;
border-radius: 12px;
font-size: 15px;
font-weight: 600;
background: rgba(255,255,255,0.2);
}
.checklist-item {
display: flex;
align-items: center;
gap: 12px;
padding: 12px;
background: var(--bubble);
border-radius: 8px;
margin-bottom: 8px;
font-size: 15px;
}
.checklist-item input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
.checklist-item.done { opacity: 0.6; }
.checklist-item.done .test-name { text-decoration: line-through; }
.test-name { flex: 1; font-weight: 500; }
.test-reason { font-size: 13px; color: var(--muted); margin-top: 2px; }
.test-status {
font-size: 12px;
padding: 4px 10px;
border-radius: 10px;
background: var(--risk-med);
color: var(--risk-med-t);
white-space: nowrap;
}
.test-status.done { background: var(--risk-low); color: var(--risk-low-t); }
.whatif-slider { margin-bottom: 16px; }
.whatif-slider label {
display: flex;
justify-content: space-between;
margin-bottom: 6px;
font-weight: 500;
font-size: 15px;
}
.whatif-slider input[type="range"] { width: 100%; accent-color: var(--btn); }
.whatif-slider .value { font-weight: 600; color: var(--btn); }
.whatif-toggle {
display: flex;
align-items: center;
gap: 10px;
padding: 12px;
background: var(--bubble);
border-radius: 8px;
margin-bottom: 8px;
cursor: pointer;
font-size: 15px;
}
.whatif-toggle input { width: 22px; height: 22px; }
.modified-banner {
background: var(--risk-med);
border-left: 4px solid var(--risk-med-t);
padding: 14px;
border-radius: 0 8px 8px 0;
margin-bottom: 16px;
font-size: 15px;
color: var(--risk-med-t);
line-height: 1.5;
}
.calc-block {
background: var(--hint-bg);
border: 1px solid var(--hint-border);
padding: 12px;
border-radius: 8px;
margin-top: 8px;
font-size: 14px;
color: var(--hint-text);
}
.calc-block strong { color: var(--btn); }
.lab-section {
background: var(--section-bg);
border-radius: 10px;
padding: 14px;
margin-bottom: 16px;
border-left: 4px solid var(--section-title);
}
.lab-section-title {
font-size: 14px;
font-weight: 700;
color: var(--section-title);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 12px;
}
.sex-pregnant-block {
background: var(--credentials-bg);
border: 1px solid var(--border);
border-radius: 10px;
padding: 14px;
margin-bottom: 16px;
}
.sex-pregnant-block .block-title {
font-size: 13px;
font-weight: 600;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 10px;
}
.checkbox-wrapper {
margin-top: 12px;
padding: 14px 16px;
background: var(--card);
border: 2px solid var(--border);
border-radius: 10px;
cursor: pointer;
transition: all 0.2s;
user-select: none;
display: block;
}
.checkbox-wrapper:hover { border-color: var(--btn); background: var(--bubble); }
.checkbox-wrapper.checked { border-color: var(--pregnant-border); background: var(--pregnant-bg); }
.checkbox-wrapper input[type="checkbox"] { display: none; }
.checkbox-wrapper .checkbox-row { display: flex; align-items: center; gap: 14px; }
.checkbox-wrapper .checkbox-icon {
width: 28px;
height: 28px;
border-radius: 8px;
border: 2px solid var(--border);
background: var(--card);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: all 0.2s;
font-size: 18px;
color: transparent;
}
.checkbox-wrapper.checked .checkbox-icon {
background: var(--pregnant-border);
border-color: var(--pregnant-border);
color: #fff;
}
.checkbox-wrapper .checkbox-label { flex: 1; }
.checkbox-wrapper .checkbox-label .main-text {
font-size: 15px;
font-weight: 600;
color: var(--text);
display: block;
margin-bottom: 2px;
}
.checkbox-wrapper .checkbox-label .sub-text {
font-size: 12px;
color: var(--muted);
font-style: italic;
}
.stop-screen { text-align: center; padding: 30px 20px; }
.stop-icon {
width: 120px;
height: 120px;
margin: 0 auto 20px;
background: var(--stop-bg);
border-radius: 50%;
display: flex;

}

function safeParseFloat(val) {

function calcFreeTestosterone(tt_nmoll, shbg_nmoll, alb_gl) {
if (tt_nmoll === null || tt_nmoll === undefined || tt_nmoll === '' ||
shbg_nmoll === null || shbg_nmoll === undefined || shbg_nmoll === '' ||
alb_gl === null || alb_gl === undefined || alb_gl === '') {
return null;

const TT = parseFloat(tt_nmoll) * 1e-9;
const SHBG = parseFloat(shbg_nmoll) * 1e-9;

const Kt = 1.0e9, Ka = 3.6e4;
const a = Kt * (1 + Ka * ALB);
const b = 1 + Ka * ALB + Kt * SHBG - Kt * TT;
const c = -TT;
const disc = b * b - 4 * a * c;
if (disc < 0) return null;
const F_mol = (-b + Math.sqrt(disc)) / (2 * a);
return F_mol * 1e12;
}

const calc = {
bmi: function() {
return (patient.weight && patient.height) ? patient.weight / Math.pow(patient.height/100, 2) : null;
},
whtr: function() {
return (patient.waist && patient.height) ? patient.waist / patient.height : null;
},
whtrRisk: function() {
const r = calc.whtr();
if (r === null) return { level: 'med', text: 'Нет данных' };
if (r < 0.5) return { level: 'low', text: 'Норма' };
if (r < 0.6) return { level: 'med', text: 'Повышен' };
return { level: 'high', text: 'Высокий' };
},
waistRisk: function() {
const w = patient.waist;
if (!w) return { level: 'med', text: 'Нет данных' };
if (patient.sex === 'f') {
if (w < 80) return { level: 'low', text: 'Норма' };
if (w < 88) return { level: 'med', text: 'Повышена' };
return { level: 'high', text: 'Высокая' };
} else {
if (w < 94) return { level: 'low', text: 'Норма' };
if (w < 102) return { level: 'med', text: 'Повышена' };
return { level: 'high', text: 'Высокая' };
}
},
findrisk: function() {
if (patient.hasDiabetes) return null;
if (!patient.age || !patient.weight || !patient.height || !patient.waist) return null;
let s = 0;
if (patient.age < 45) s += 0;
else if (patient.age < 55) s += 2;
else if (patient.age < 65) s += 3;
else s += 4;
const bmi = calc.bmi();
if (bmi < 25) s += 0; else if (bmi < 30) s += 1; else s += 3;
if (patient.sex === 'm') {
if (patient.waist < 94) s += 0; else if (patient.waist < 102) s += 3; else s += 4;
} else {
if (patient.waist < 80) s += 0; else if (patient.waist < 88) s += 3; else s += 4;
}
if (patient.activity < 1) s += 2;
if (patient.vegetables < 1) s += 1;
if (patient.hypertension) s += 2;
if (patient.glucoseHistory) s += 5;
if (patient.familyDiabetes) s += 3;
return s;
},
findriskText: function() {
const s = calc.findrisk();
if (s === null) return { level: 'med', text: 'Недостаточно данных', pct: null, type: 'risk' };
if (s < 7) return { level: 'low', text: 'Низкий (' + s + ' баллов) — ~1% на 10 лет', pct: getPos('low','risk'), type: 'risk' };
if (s < 15) return { level: 'med', text: 'Умеренный (' + s + ') — ~4-17% на 10 лет', pct: getPos('med','risk'), type: 'risk' };
if (s < 21) return { level: 'high', text: 'Высокий (' + s + ') — ~33% на 10 лет', pct: getPos('high','risk'), type: 'risk' };
return { level: 'high', text: 'Очень высокий (' + s + ') — ~50% на 10 лет', pct: getPos('vhigh','risk'), type: 'risk' };
},
fib4: function() {
if (!patient.alt || !patient.ast || !patient.platelets || !patient.age) return null;
return (patient.age * patient.ast) / (patient.platelets * Math.sqrt(patient.alt));
},
fib4Text: function() {
const v = calc.fib4();
if (v === null) return { level: 'med', text: 'Недостаточно данных', pct: null, type: 'risk' };
if (v < 1.3) return { level: 'low', text: 'Низкий риск фиброза (' + v.toFixed(2) + ')', pct: getPos('low','risk'), type: 'risk' };

return { level: 'high', text: 'Высокий (' + v.toFixed(2) + ') — вероятен фиброз', pct: getPos('high','risk'), type: 'risk' };
},
egfr: function() {
if (!patient.creatinine || !patient.age || !patient.sex) return null;
const scr = patient.creatinine / 88.4;
const kappa = patient.sex === 'f' ? 0.7 : 0.9;
const alpha = patient.sex === 'f' ? -0.241 : -0.302;
const min = Math.min(scr / kappa, 1);
const max = Math.max(scr / kappa, 1);
return 142 * Math.pow(min, alpha) * Math.pow(max, -1.200) * Math.pow(0.9938, patient.age) * (patient.sex === 'f' ? 1.012 : 1);
},
egfrText: function() {

score2: function() {
if (patient.hasDiabetes) return null;
if (patient.age < 40) return { level: 'warn', text: 'Шкала SCORE2 валидна с 40 лет', pct: null, tooYoung: true, type: 'risk', note: SCORE2_DISCLAIMER };
if (patient.age > 89) return { level: 'warn', text: 'Шкала SCORE2 валидна до 89 лет', pct: null, tooOld: true, type: 'risk', note: SCORE2_DISCLAIMER };
if (!patient.sbp || !patient.cholesterol || !patient.hdl || !patient.age || !patient.sex)
return { level: 'med', text: 'Недостаточно данных', pct: null, type: 'risk', note: SCORE2_DISCLAIMER };
const nonHDL = patient.cholesterol - patient.hdl;
const age = patient.age;
const smoking = patient.smoking ? 1 : 0;
const sbp = patient.sbp;
let alpha, b1, b2, b3, b4, b5, b6, b7, St;
if (age < 70) {
if (patient.sex === 'm') {
alpha = -11.33; b1 = 0.074; b2 = 0.60; b3 = 0.23; b4 = 0.15;
b5 = -0.009; b6 = -0.002; b7 = -0.002; St = 0.9333;
} else {
alpha = -13.17; b1 = 0.078; b2 = 0.66; b3 = 0.28; b4 = 0.17;
b5 = -0.012; b6 = -0.003; b7 = -0.002; St = 0.9622;
}
} else {
if (patient.sex === 'm') {
alpha = -8.44; b1 = 0.055; b2 = 0.43; b3 = 0.19; b4 = 0.12;
b5 = -0.006; b6 = -0.001; b7 = -0.001; St = 0.8933;
} else {
alpha = -9.77; b1 = 0.060; b2 = 0.48; b3 = 0.23; b4 = 0.14;
b5 = -0.008; b6 = -0.002; b7 = -0.001; St = 0.9346;
}
}
const linearPredictor = alpha + b1*age + b2*smoking + b3*(sbp/10) + b4*nonHDL + b5*age*smoking + b6*age*(sbp/10) + b7*age*nonHDL;
const risk = 1 - Math.pow(St, Math.exp(linearPredictor));
const riskPct = Math.max(0, Math.min(100, risk * 100));
let level, txt, suffix = '';
if (age < 50) {
if (riskPct < 2.5) { level = 'low'; txt = 'Низкий'; }
else if (riskPct < 7.5) { level = 'med'; txt = 'Умеренный'; }
else { level = 'high'; txt = 'Высокий'; }
} else if (age < 70) {
if (riskPct < 5) { level = 'low'; txt = 'Низкий'; }
else if (riskPct < 10) { level = 'med'; txt = 'Умеренный'; }
else { level = 'high'; txt = 'Высокий'; }
} else {
suffix = ' [SCORE2-OP]';
if (riskPct < 7.5) { level = 'low'; txt = 'Низкий'; }
else if (riskPct < 15) { level = 'med'; txt = 'Умеренный'; }
else { level = 'high'; txt = 'Высокий'; }
}
// Корректировка при множественных факторах риска
let adjusted = false;
let riskFactorsCount = 0;
if (patient.smoking) riskFactorsCount++;
if (patient.sbp >= 140) riskFactorsCount++;
if (patient.cholesterol >= 6.0) riskFactorsCount++;
if (age >= 60) riskFactorsCount++;
if (riskFactorsCount >= 3 && level === 'low') {
level = 'med';
txt = 'Умеренный (по числу факторов риска)';
adjusted = true;
}
if (riskFactorsCount >= 4 && level !== 'high') {
level = 'high';
txt = 'Высокий (по числу факторов риска)';
adjusted = true;
}
const pctText = adjusted ? '' : ' (~' + riskPct.toFixed(1) + '% на 10 лет)';
return { level: level, text: txt + pctText + suffix, pct: getPos(level,'risk'), riskPct: riskPct, isOP: age >= 70, type: 'risk', riskFactorsCount: riskFactorsCount, adjusted: adjusted, note: SCORE2_DISCLAIMER };
},
biologicalAge: function() {
if (!patient.age) return null;
let bio = patient.age;
if (patient.smoking) bio += 4;
const bmi = calc.bmi();
if (bmi && bmi >= 30) bio += 5;
else if (bmi && bmi >= 25) bio += 2;
if (patient.sbp >= 140) bio += 3;
else if (patient.sbp >= 130) bio += 1;
if (patient.activity < 1) bio += 2;
else if (patient.activity >= 3) bio -= 1;
const whtr = calc.whtr();
if (whtr && whtr >= 0.6) bio += 3;
else if (whtr && whtr >= 0.5) bio += 1;
if (patient.cholesterol && patient.cholesterol >= 6) bio += 2;
if (patient.familyCancer) bio += 1;
if (patient.alcohol > 7) bio += 1;
if (patient.vegetables < 3) bio += 1;
bio = Math.round(bio);
bio = Math.max(18, Math.min(patient.age + 20, bio));
return bio;
}
};

function renderRiskScale(pct, label, type) {
if (pct === null || pct === undefined) return '';
const clamped = Math.max(0, Math.min(100, pct));
let scaleType, segCount, labelsHtml;
if (type === 'bi') {
scaleType = 'bi-type';
segCount = 5;
labelsHtml = '<span>Снижено</span><span>Умер. снижено</span><span>Норма</span><span>Умер. повышено</span><span>Повышено</span>';
} else if (type === 'egfr') {
scaleType = 'egfr-type';
segCount = 5;
labelsHtml = '<span>&lt;45</span><span>45–60</span><span>60–90</span><span>90–120</span><span>&gt;120</span>';
} else {
scaleType = 'risk-type';
segCount = 4;
labelsHtml = '<span>Низкий</span><span>Умеренный</span><span>Высокий</span><span>Очень высокий</span>';
}
let segs = '';
for (let i = 1; i <= segCount; i++) {
segs += '<div class="seg s' + i + '"></div>';
}
return '<div class="risk-scale ' + scaleType + '">' +
'<div class="risk-scale-bar">' +
segs +
'<div class="risk-scale-marker" style="left:calc(' + clamped + '% - 2px)"></div>' +
'</div>' +
'<div class="risk-scale-labels">' + labelsHtml + '</div>' +
(label ? '<div style="text-align:center;margin-top:6px;font-size:12px;color:var(--muted)">' + label + '</div>' : '') +
'</div>';
}

window.togglePregnancyField = function() {

const pregField = document.getElementById('pregnantField');
if (!sexSelect || !pregField) return;
const sex = sexSelect.value;
pregField.style.display = sex === 'f' ? 'block' : 'none';
if (sex === 'm') {

};

function getStepRequiredInfo(step) {
const requiredFields = {
0: ['age'],
1: ['height', 'weight', 'waist'],
2: [],
3: []
};
const fields = requiredFields[step] || [];
let filled = 0;
fields.forEach(function(id) {
const el = document.getElementById(id);
if (!el) return;
const val = String(el.value).trim().replace(',', '.');
if (val !== '' && !isNaN(parseFloat(val)) && parseFloat(val) > 0) filled++;
});
return { filled: filled, total: fields.length };
}

function updateProgressBar(step) {
const progress = document.querySelector('.progress');
if (!progress) return;
const bar = progress.querySelector('.progress-bar');
if (bar) bar.style.width = ((step + 1) * 25) + '%';
const segs = progress.querySelectorAll('.progress-seg');
segs.forEach(function(seg, i) {
seg.classList.remove('done', 'current');
if (i < step) seg.classList.add('done');
else if (i === step) seg.classList.add('current');
});
const info = getStepRequiredInfo(step);
const indicator = progress.querySelector('.fill-indicator');
if (indicator) {
if (info.total === 0) {
indicator.textContent = 'Шаг ' + (step + 1) + ' из 4';
} else {
indicator.textContent = 'Шаг ' + (step + 1) + ' из 4 • ' + info.filled + ' из ' + info.total + ' обязательных';
}
}
}

function showStepCheck() {
const check = document.querySelector('.step-check');
if (!check) return;
check.classList.remove('show');
void check.offsetWidth;
check.classList.add('show');
setTimeout(function() { check.classList.remove('show'); }, 1600);
}

function validateFieldLive(id) {
const rule = liveValidationRules[id];
if (!rule) return;
const el = document.getElementById(id);
if (!el) return;
const field = el.closest('.field');
if (!field) return;
const raw = String(el.value).trim();
const errText = field.querySelector('.field-error-text');
if (raw === '') {
field.classList.remove('error');
if (errText) errText.textContent = '';
return;
}
const num = parseFloat(raw.replace(',', '.'));
if (isNaN(num)) {
field.classList.add('error');
if (errText) errText.textContent = 'Введите число';
return;
}
if (num < rule.min || num > rule.max) {
field.classList.add('error');
if (errText) errText.textContent = rule.msg;
} else {
field.classList.remove('error');
if (errText) errText.textContent = '';
}
}

function attachLiveValidation() {
Object.keys(liveValidationRules).forEach(function(id) {
const el = document.getElementById(id);
if (!el) return;
el.removeEventListener('input', el._liveHandler);
el._liveHandler = function() { validateFieldLive(id); updateProgressBar(currentStep); };
el.addEventListener('input', el._liveHandler);
});
}

function validateStep(step) {
const errors = [];
const raw = function(id) {
const el = document.getElementById(id);
return el ? String(el.value).trim() : '';
};
const num = function(id) {
const s = raw(id).replace(',', '.');
if (s === '') return NaN;
return parseFloat(s);
};
if (step === 0) {
const age = num('age');
if (!isFinite(age) || age <= 0) errors.push({ id: 'age', text: 'возраст' });
else if (age < 18 || age > 100) errors.push({ id: 'age', text: 'возраст (должен быть 18–100)' });
} else if (step === 1) {
const h = num('height');
if (!isFinite(h) || h <= 0) errors.push({ id: 'height', text: 'рост' });
else if (h < 120 || h > 230) errors.push({ id: 'height', text: 'рост (должен быть 120–230 см)' });
const w = num('weight');
if (!isFinite(w) || w <= 0) errors.push({ id: 'weight', text: 'вес' });
else if (w < 30 || w > 250) errors.push({ id: 'weight', text: 'вес (должен быть 30–250 кг)' });
const wa = num('waist');
if (!isFinite(wa) || wa <= 0) errors.push({ id: 'waist', text: 'окружность талии' });
else if (wa < 40 || wa > 180) errors.push({ id: 'waist', text: 'талия (должна быть 40–180 см)' });
}
return errors;
}

function showFormErrors(errors) {
content.querySelectorAll('.field.error').forEach(function(f) {
if (!f.querySelector('.field-error-text') || !f.querySelector('.field-error-text').textContent) {
f.classList.remove('error');
}
});
errors.forEach(function(e) {
const el = document.getElementById(e.id);
if (el) {
const f = el.closest('.field');
if (f) {
f.classList.add('error');
const errText = f.querySelector('.field-error-text');
if (errText && !errText.textContent) errText.textContent = 'Заполните обязательное поле';
}
}
});
const box = document.getElementById('formError');
if (box) {
box.innerHTML = '<div class="error-message">Не введены основные данные для расчёта рисков: ' +
errors.map(function(e) { return e.text; }).join(', ') +
'.<br>Заполните отмеченные поля. Остальные показатели можно оставить пустыми.</div>';
box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
}

{n: 'Магний', r: 'Важный микроэлемент', d: patient.magnesium !== null},
{n: 'ТТГ', r: 'Скрининг щитовидной железы', d: patient.tsh !== null},
{n: 'Витамин D 25(OH)', r: 'Частый дефицит в России; норма 30–100 нг/мл', d: patient.vitamin_d !== null},
{n: 'Витамин B12', r: 'Норма 200–900 пг/мл', d: patient.vitamin_b12 !== null},
{n: 'Витамин B9 (фолиевая кислота)', r: 'Норма 3–17 нг/мл; дефицит — частая причина макроцитарной анемии', d: patient.folate !== null},
{n: 'Ферритин', r: 'Запасы железа; дефицит <30 нг/мл', d: patient.ferritin !== null},
{n: 'С-реактивный белок (СРБ)', r: 'Оценка воспаления; для интерпретации ферритина', d: patient.crp !== null},
{n: 'Мочевая кислота', r: 'Обмен пуринов', d: patient.uric_acid !== null},
{n: 'Тестостерон общий + ГСПГ', r: 'Для мужчин: расчёт свободного тестостерона', d: patient.testosterone !== null || patient.gspg !== null, maleOnly: true},
{n: 'ПСА', r: 'Скрининг рака простаты (мужчины 45+)', d: patient.psa !== null, maleOnly: true},
{n: 'ЭКГ', r: 'Оценка ритма и проводимости сердца', d: false},
{n: 'Флюорография лёгких', r: 'Скрининг туберкулёза (1 раз в 1–2 года)', d: false}
];
const filteredTests = tests.filter(function(t) { return !t.maleOnly || patient.sex === 'm'; });
content.innerHTML =
'<div class="fade-in">' +
'<h2 style="margin-top:0;color:var(--btn)">Чек-лист для лаборатории</h2>' +
'<p style="color:var(--muted)">Отметьте, что уже сдавали. Список можно скопировать, сохранить или распечатать.</p>' +
'<div id="checklist">' +
filteredTests.map(function(t) {
const isChecked = !!checks[t.n];
return '<div class="checklist-item' + (isChecked ? ' done' : '') + '">' +
'<input type="checkbox" data-test="' + t.n + '"' + (isChecked ? ' checked' : '') + '>' +
'<div style="flex:1"><div class="test-name">' + t.n + '</div><div class="test-reason">' + t.r + '</div></div>' +
'<span class="test-status' + (t.d ? ' done' : '') + '">' + (t.d ? '✓ уже есть' : 'рекомендуется') + '</span>' +
'</div>';
}).join('') +
'</div>' +
'<div class="actions stagger">' +
'<button class="btn accent" id="copyBtn">📋 Скопировать список</button>' +
'<button class="btn" id="printChecklistBtn">🖨 Распечатать для лаборатории</button>' +
'<button class="btn secondary" id="saveChecklistBtn">💾 Сохранить как файл</button>' +
'<button class="btn secondary" id="labBack">← К отчёту</button>' +
'</div>' +
'</div>';
const checkboxes = content.querySelectorAll('#checklist input[type="checkbox"]');
checkboxes.forEach(function(cb) {
cb.addEventListener('change', function() {
playClick();
checks[cb.getAttribute('data-test')] = cb.checked;
cb.parentElement.classList.toggle('done', cb.checked);
storage.set('labChecks', JSON.stringify(checks));
});
});
document.getElementById('copyBtn').addEventListener('click', function() {
playSuccess();
const list = filteredTests.map(function(t, i) {
const cb = document.querySelector('#checklist input[data-test="' + t.n + '"]');
const mark = cb && cb.checked ? '✓' : '○';
return (i+1) + '. ' + mark + ' ' + t.n + ' — ' + t.r;
}).join('\n');
const full = 'Чек-лист анализов для ' + displayName() + ':\n' + list + '\nДата: ' + new Date().toLocaleDateString('ru-RU');
if (navigator.clipboard) {
navigator.clipboard.writeText(full).then(function() {
document.getElementById('copyBtn').textContent = '✓ Скопировано!';
setTimeout(function() { document.getElementById('copyBtn').textContent = '📋 Скопировать список'; }, 2000);
});
} else {
const ta = document.createElement('textarea');
ta.value = full;
document.body.appendChild(ta);
ta.select();
document.execCommand('copy');
document.body.removeChild(ta);
document.getElementById('copyBtn').textContent = '✓ Скопировано!';
}
});
document.getElementById('printChecklistBtn').addEventListener('click', function() {
playClick();
printChecklist(filteredTests);
});
document.getElementById('saveChecklistBtn').addEventListener('click', function() {
playClick();
saveChecklistAsFile(filteredTests);
});
document.getElementById('labBack').addEventListener('click', function() { playClick(); renderReport(); });
}

function printChecklist(tests) {
const dateStr = new Date().toLocaleDateString('ru-RU');
const listHtml = tests.map(function(t) {
return '<tr><td style="width:30px;font-size:16px">☐</td><td style="padding:8px 12px;font-size:15px;font-weight:500">' + t.n + '</td><td style="padding:8px 12px;font-size:13px;color:#666">' + t.r + '</td></tr>';
}).join('');
const printWindow = window.open('', '_blank', 'width=800,height=900');
if (!printWindow) {
alert('Браузер заблокировал всплывающее окно. Разрешите всплывающие окна для этого сайта.');
return;
}
printWindow.document.write(
'<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Чек-лист анализов — ' + displayName() + '</title>' +
'<style>' +
'body { font-family: Arial, sans-serif; padding: 30px; max-width: 800px; margin: 0 auto; color: #222; }' +
'h1 { color: #2c5282; border-bottom: 2px solid #2c5282; padding-bottom: 10px; font-size: 22px; }' +
'.header-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; color: #555; }' +
'table { width: 100%; border-collapse: collapse; margin-top: 10px; }' +
'tr { border-bottom: 1px solid #ddd; }' +
'tr:nth-child(even) { background: #f9f9f9; }' +
'.legend { margin-top: 20px; padding: 12px; background: #f0f7ff; border-left: 4px solid #2c5282; font-size: 13px; color: #2c5282; }' +
'.signature { margin-top: 60px; display: flex; justify-content: space-between; font-size: 14px; }' +
'.signature div { border-top: 1px solid #333; padding-top: 5px; width: 45%; }' +
'.footer { margin-top: 30px; font-size: 11px; color: #888; text-align: center; border-top: 1px solid #ddd; padding-top: 10px; }' +
'@media print { body { padding: 15px; } .no-print { display: none; } }' +
'</style></head><body>' +
'<h1>Направление на лабораторные исследования</h1>' +
'<div class="header-info"><div><strong>Пациент:</strong> ' + displayName() + '</div><div><strong>Дата:</strong> ' + dateStr + '</div></div>' +
'<table>' + listHtml + '</table>' +
'<div class="legend"><strong>Условные обозначения:</strong> ☐ — необходимо сдать. Референсные значения уточняйте в лаборатории.</div>' +
'<div class="signature"><div>Подпись врача</div><div>Подпись пациента</div></div>' +
'<div class="footer">Документ сформирован автоматически. Не является официальным медицинским направлением. Для записи: ' + TAPLINK_ONLINE + '</div>' +
'<div class="no-print" style="margin-top:20px;text-align:center"><button onclick="window.print()" style="padding:10px 20px;font-size:15px;cursor:pointer;background:#2c5282;color:#fff;border:none;border-radius:6px">🖨 Распечатать</button> <button onclick="window.close()" style="padding:10px 20px;font-size:15px;cursor:pointer;background:#edf2f7;color:#2d3748;border:none;border-radius:6px;margin-left:10px">Закрыть</button></div>' +
'</body></html>'
);
printWindow.document.close();
}

function saveChecklistAsFile(tests) {
const dateStr = new Date().toLocaleDateString('ru-RU');
const lines = [];
lines.push('ЧЕК-ЛИСТ АНАЛИЗОВ');
lines.push('===================');
lines.push('Пациент: ' + displayName());
lines.push('Дата: ' + dateStr);
lines.push('');
lines.push('СПИСОК АНАЛИЗОВ:');
lines.push('');
tests.forEach(function(t, i) {
lines.push((i+1) + '. [ ] ' + t.n);
lines.push('     ' + t.r);
lines.push('');
});
lines.push('===================');
lines.push('Примечание: референсные значения уточняйте в лаборатории.');
lines.push('Для записи на приём: ' + TAPLINK_ONLINE);
const text = lines.join('\n');
const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'Чеклист_анализов_' + displayName().replace(/\s+/g, '_') + '_' + dateStr.replace(/\./g, '-') + '.txt';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}

function resetAll() {
storage.remove('patientData');
storage.remove('labChecks');
patient = getInitialPatient();
originalPatientData = null;
dataModifiedViaWhatIf = false;
currentNode = 'start';
currentStep = 0;
renderIntro();
}

window.app = {
goToStep: function(step) {
try {
playClick();
saveStep(currentStep);
currentStep = step;
renderForm(currentStep);
} catch(e) {
console.error('goToStep error:', e);
}
}
};

document.getElementById('resetBtn').addEventListener('click', function() {
try {
playClick();
resetAll();
} catch(e) {
console.error('resetBtn error:', e);
}
});

renderIntro();
})();
</script>
</body>
