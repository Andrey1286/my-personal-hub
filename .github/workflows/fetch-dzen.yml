name: Fetch Dzen Articles

on:
  schedule:
    - cron: '0 * * * *'  # каждый час в начале часа
  workflow_dispatch:      # ручной запуск из вкладки Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse RSS
        run: |
          python3 scripts/fetch_dzen.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dzen-articles.json
          git diff --cached --quiet || git commit -m "📰 Обновлены статьи из Дзена"
          git push
